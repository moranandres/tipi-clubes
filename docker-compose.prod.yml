name: tipi-clubes

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tipi_clubes}
      POSTGRES_USER: ${POSTGRES_USER:-tipi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      TZ: America/Guayaquil
    volumes:
      - tipi_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    image: tipi-backend:${TIPI_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-tipi_clubes}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-tipi}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-30}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?Defina FRONTEND_BASE_URL en .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Defina CORS_ALLOWED_ORIGINS en .env}
      APP_STORAGE_DIR: /var/lib/tipi/archivos
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:-TIPI 3.0 <no-responder@tipi.local>}
      OPENAPI_ENABLED: "false"
    volumes:
      - tipi_archivos:/var/lib/tipi/archivos
    expose:
      - "8080"

  web:
    build:
      context: ./web
    image: tipi-web:${TIPI_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_URL: http://backend:8080
      SESION_COOKIE_SEGURA: ${SESION_COOKIE_SEGURA:-true}
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"

volumes:
  tipi_db:
  tipi_archivos:
