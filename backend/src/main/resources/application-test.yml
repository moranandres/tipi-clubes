spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tipi_clubes_test
    username: ${TIPI_TEST_DB_USERNAME:postgres}
    password: ${TIPI_TEST_DB_PASSWORD:Salesiana}
    hikari:
      maximum-pool-size: 5
      data-source-properties:
        ApplicationName: tipi-pruebas
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

tipi:
  storage:
    directorio: target/uploads-test

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
