spring:
  application:
    name: tipi-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://localhost:5432/tipi_clubes
    username: postgres
    password: Salesiana
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

tipi:
  security:
    jwt-secret: ${JWT_SECRET:clave-solo-para-desarrollo-tipi-3-0-cambiala-en-produccion}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}
    max-failed-attempts: 5
    lock-minutes: 15
    limpieza-cron: "${TOKENS_LIMPIEZA_CRON:0 0 3 * * *}"
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
  bootstrap:
    admin-password: ${ADMIN_INITIAL_PASSWORD:Cambiar#2026}
  storage:
    evidencias-dir: ./uploads