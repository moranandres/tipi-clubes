spring:
  application:
    name: tipi-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://localhost:5432/tipi_clubes
    username: postgres
    password: Salesiana
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

tipi:
  security:
    jwt-secret: ${JWT_SECRET:clave-solo-para-desarrollo-tipi-3-0-cambiala-en-produccion}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}
    max-failed-attempts: 5
    lock-minutes: 15
    limpieza-cron: "${TOKENS_LIMPIEZA_CRON:0 0 3 * * *}"
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5500}
  recuperacion:
    remitente: "${MAIL_FROM:TIPI 3.0 <no-responder@tipi.local>}"
    minutos-validez: ${RECUPERACION_MINUTOS_VALIDEZ:30}
    max-por-cuenta-hora: 3
    max-por-ip-15-minutos: 10
  bootstrap:
    admin-password: ${ADMIN_INITIAL_PASSWORD:Cambiar#2026}
  storage:
    evidencias-dir: ./uploads