<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cambiar contraseña | TIPI 3.0</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <main class="contenedor-login d-flex align-items-center justify-content-center p-3">
    <div class="card shadow-sm tarjeta-login w-100">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="bi bi-shield-lock fs-1 text-primary" aria-hidden="true"></i>
          <h1 class="h4 mt-2 mb-1">Cambiar contraseña</h1>
        </div>
        <div id="alertas" aria-live="polite"></div>
        <form id="formulario-password" novalidate>
          <div class="mb-3">
            <label for="password-actual" class="form-label">Contraseña actual</label>
            <input type="password" class="form-control" id="password-actual"
                   autocomplete="current-password" maxlength="128" required>
          </div>
          <div class="mb-3">
            <label for="password-nueva" class="form-label">Contraseña nueva</label>
            <input type="password" class="form-control" id="password-nueva"
                   autocomplete="new-password" maxlength="128" required aria-describedby="ayuda-password">
            <div id="ayuda-password" class="form-text">
              Entre 10 y 128 caracteres, con al menos una mayúscula, una minúscula y un número.
            </div>
          </div>
          <div class="mb-3">
            <label for="password-confirmacion" class="form-label">Confirmar contraseña nueva</label>
            <input type="password" class="form-control" id="password-confirmacion"
                   autocomplete="new-password" maxlength="128" required>
          </div>
          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary" id="boton-guardar">Guardar contraseña</button>
            <a href="dashboard.html" class="btn btn-outline-secondary" id="enlace-cancelar" hidden>Cancelar</a>
            <button type="button" class="btn btn-link" id="boton-salir" hidden>Cerrar sesión</button>
          </div>
        </form>
      </div>
    </div>
  </main>
  <script type="module" src="js/cambiar-password.js"></script>
</body>
</html>
