<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | TIPI 3.0</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <main class="contenedor-login d-flex align-items-center justify-content-center p-3">
    <div class="card shadow-sm tarjeta-login w-100">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="bi bi-robot fs-1 text-primary" aria-hidden="true"></i>
          <h1 class="h4 mt-2 mb-1">TIPI 3.0</h1>
          <p class="text-body-secondary mb-0">Gestión de clubes de robótica y programación</p>
        </div>
        <div id="alertas" aria-live="polite"></div>
        <form id="formulario-login">
          <div class="mb-3">
            <label for="identificador" class="form-label">Usuario o correo electrónico</label>
            <input type="text" class="form-control" id="identificador" name="identificador"
                   autocomplete="username" maxlength="150" required autofocus>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" name="password"
                   autocomplete="current-password" maxlength="128" required>
          </div>
          <button type="submit" class="btn btn-primary w-100" id="boton-ingresar">Ingresar</button>
        </form>
        <div class="text-center mt-3">
          <a href="recuperar.html">¿Olvidó su contraseña?</a>
        </div>
      </div>
    </div>
  </main>
  <script type="module" src="js/login.js"></script>
</body>
</html>
