<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:8080; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <title>Restablecer contraseña | TIPI 3.0</title>
  <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="vendor/bootstrap-icons/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <main class="contenedor-login d-flex align-items-center justify-content-center p-3">
    <div class="card shadow-sm tarjeta-login w-100">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="bi bi-shield-lock fs-1 text-primary" aria-hidden="true"></i>
          <h1 class="h4 mt-2 mb-1">Restablecer contraseña</h1>
        </div>
        <div id="alertas" aria-live="polite"></div>
        <form id="formulario-restablecer" novalidate hidden>
          <div class="mb-3">
            <label for="password-nueva" class="form-label">Contraseña nueva</label>
            <input type="password" class="form-control" id="password-nueva"
                   autocomplete="new-password" maxlength="128" required aria-describedby="ayuda-password">
            <div id="ayuda-password" class="form-text">
              Entre 10 y 128 caracteres, con al menos una mayúscula, una minúscula y un número.
            </div>
          </div>
          <div class="mb-3">
            <label for="password-confirmacion" class="form-label">Confirmar contraseña nueva</label>
            <input type="password" class="form-control" id="password-confirmacion"
                   autocomplete="new-password" maxlength="128" required>
          </div>
          <button type="submit" class="btn btn-primary w-100" id="boton-guardar">Guardar contraseña</button>
        </form>
        <div class="d-flex justify-content-between mt-3 small">
          <a href="recuperar.html">Solicitar un enlace nuevo</a>
          <a href="login.html">Volver al inicio de sesión</a>
        </div>
      </div>
    </div>
  </main>
  <script type="module" src="js/restablecer.js"></script>
</body>
</html>
