<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:8080; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Recuperar contraseña | TIPI 3.0</title>
  <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="vendor/bootstrap-icons/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <main class="contenedor-login d-flex align-items-center justify-content-center p-3">
    <div class="card shadow-sm tarjeta-login w-100">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="bi bi-envelope-paper fs-1 text-primary" aria-hidden="true"></i>
          <h1 class="h4 mt-2 mb-1">Recuperar contraseña</h1>
          <p class="text-body-secondary mb-0">
            Le enviaremos un enlace al correo registrado en su cuenta.
          </p>
        </div>
        <div id="alertas" aria-live="polite"></div>
        <form id="formulario-recuperar" novalidate>
          <div class="mb-3">
            <label for="identificador" class="form-label">Usuario o correo electrónico</label>
            <input type="text" class="form-control" id="identificador" name="identificador"
                   autocomplete="username" maxlength="150" required autofocus>
          </div>
          <button type="submit" class="btn btn-primary w-100" id="boton-enviar">Enviar enlace</button>
        </form>
        <div class="text-center mt-3">
          <a href="login.html">Volver al inicio de sesión</a>
        </div>
      </div>
    </div>
  </main>
  <script type="module" src="js/recuperar.js"></script>
</body>
</html>
