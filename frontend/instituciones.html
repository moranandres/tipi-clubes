<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:8080; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Instituciones | TIPI 3.0</title>
  <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="vendor/bootstrap-icons/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <a class="visually-hidden-focusable position-absolute p-2 bg-white" href="#contenido">Saltar al contenido</a>
  <header id="barra-superior"></header>
  <div class="container-fluid">
    <div class="row">
      <nav id="menu-lateral" class="col-lg-3 col-xl-2 p-0" aria-label="Menú principal"></nav>
      <main id="contenido" class="col-lg-9 col-xl-10 p-3 p-md-4" tabindex="-1">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
          <h1 class="h3 mb-0">Instituciones</h1>
          <button type="button" class="btn btn-primary" id="boton-nueva" hidden>
            <i class="bi bi-plus-lg me-1" aria-hidden="true"></i>Nueva institución
          </button>
        </div>

        <div id="alertas" aria-live="polite"></div>

        <form id="formulario-filtros" class="card card-body shadow-sm mb-3">
          <div class="row g-2 align-items-end">
            <div class="col-12 col-md-4">
              <label for="filtro-q" class="form-label mb-1">Nombre o código AMIE</label>
              <input type="search" class="form-control" id="filtro-q" maxlength="100">
            </div>
            <div class="col-6 col-md-2">
              <label for="filtro-provincia" class="form-label mb-1">Provincia</label>
              <input type="text" class="form-control" id="filtro-provincia" maxlength="80">
            </div>
            <div class="col-6 col-md-2">
              <label for="filtro-canton" class="form-label mb-1">Cantón</label>
              <input type="text" class="form-control" id="filtro-canton" maxlength="80">
            </div>
            <div class="col-6 col-md-2">
              <label for="filtro-estado" class="form-label mb-1">Estado</label>
              <select class="form-select" id="filtro-estado">
                <option value="">Todos</option>
                <option value="PENDIENTE">Pendiente</option>
                <option value="ADHERIDA">Adherida</option>
                <option value="SUSPENDIDA">Suspendida</option>
                <option value="RETIRADA">Retirada</option>
              </select>
            </div>
            <div class="col-6 col-md-2 d-flex gap-2">
              <button type="submit" class="btn btn-primary flex-fill">Buscar</button>
              <button type="reset" class="btn btn-outline-secondary flex-fill">Limpiar</button>
            </div>
          </div>
        </form>

        <div class="card shadow-sm">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <caption class="visually-hidden">Listado de instituciones educativas</caption>
              <thead class="table-light">
                <tr>
                  <th scope="col">AMIE</th>
                  <th scope="col">Institución</th>
                  <th scope="col">Ubicación</th>
                  <th scope="col">Autoridad</th>
                  <th scope="col">Estado</th>
                  <th scope="col">Adhesión</th>
                  <th scope="col" class="text-end">Acciones</th>
                </tr>
              </thead>
              <tbody id="cuerpo-tabla"></tbody>
            </table>
          </div>
          <div class="card-footer d-flex flex-wrap justify-content-between align-items-center gap-2">
            <small class="text-body-secondary" id="resumen-resultados" aria-live="polite"></small>
            <nav id="paginacion" aria-label="Paginación de instituciones"></nav>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="modal fade" id="modal-institucion" tabindex="-1" aria-labelledby="titulo-modal-institucion" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <form class="modal-content" id="formulario-institucion" novalidate>
        <div class="modal-header">
          <h2 class="modal-title h5" id="titulo-modal-institucion">Institución</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div id="alertas-modal" aria-live="polite"></div>
          <div class="row g-3">
            <div class="col-md-4">
              <label for="campo-codigoAmie" class="form-label">Código AMIE *</label>
              <input type="text" class="form-control font-monospace text-uppercase" id="campo-codigoAmie"
                     maxlength="8" placeholder="09H00001" required>
            </div>
            <div class="col-md-8">
              <label for="campo-nombre" class="form-label">Nombre de la institución *</label>
              <input type="text" class="form-control" id="campo-nombre" maxlength="200" required>
            </div>
            <div class="col-md-4">
              <label for="campo-provincia" class="form-label">Provincia *</label>
              <input type="text" class="form-control" id="campo-provincia" maxlength="80" required>
            </div>
            <div class="col-md-4">
              <label for="campo-canton" class="form-label">Cantón *</label>
              <input type="text" class="form-control" id="campo-canton" maxlength="80" required>
            </div>
            <div class="col-md-4">
              <label for="campo-zona" class="form-label">Zona</label>
              <input type="text" class="form-control" id="campo-zona" maxlength="30">
            </div>
            <div class="col-md-6">
              <label for="campo-circuito" class="form-label">Circuito</label>
              <input type="text" class="form-control" id="campo-circuito" maxlength="80">
            </div>
            <div class="col-md-6">
              <label for="campo-direccion" class="form-label">Dirección</label>
              <input type="text" class="form-control" id="campo-direccion" maxlength="255">
            </div>
            <div class="col-md-4">
              <label for="campo-telefono" class="form-label">Teléfono</label>
              <input type="tel" class="form-control" id="campo-telefono" maxlength="30">
            </div>
            <div class="col-md-8">
              <label for="campo-correoContacto" class="form-label">Correo de contacto</label>
              <input type="email" class="form-control" id="campo-correoContacto" maxlength="150">
            </div>
            <div class="col-md-8">
              <label for="campo-autoridadNombre" class="form-label">Autoridad institucional</label>
              <input type="text" class="form-control" id="campo-autoridadNombre" maxlength="150">
            </div>
            <div class="col-md-4">
              <label for="campo-autoridadCargo" class="form-label">Cargo</label>
              <input type="text" class="form-control" id="campo-autoridadCargo" maxlength="80">
            </div>
            <div class="col-md-6">
              <label for="campo-estadoAdhesion" class="form-label">Estado de adhesión *</label>
              <select class="form-select" id="campo-estadoAdhesion" required>
                <option value="PENDIENTE">Pendiente</option>
                <option value="ADHERIDA">Adherida</option>
                <option value="SUSPENDIDA">Suspendida</option>
                <option value="RETIRADA">Retirada</option>
              </select>
            </div>
            <div class="col-md-6">
              <label for="campo-fechaAdhesion" class="form-label">Fecha de adhesión</label>
              <input type="date" class="form-control" id="campo-fechaAdhesion">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cerrar</button>
          <button type="submit" class="btn btn-primary" id="boton-guardar">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal fade" id="modal-responsable" tabindex="-1" aria-labelledby="titulo-modal-responsable" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content" id="formulario-responsable" novalidate>
        <div class="modal-header">
          <h2 class="modal-title h5" id="titulo-modal-responsable">Responsable institucional</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <p class="fw-semibold mb-1" id="responsable-institucion"></p>
          <p class="text-body-secondary small" id="responsable-actual"></p>
          <div id="alertas-responsable" aria-live="polite"></div>
          <label for="responsable-usuario" class="form-label">Usuario responsable</label>
          <select class="form-select" id="responsable-usuario" disabled></select>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cerrar</button>
          <button type="submit" class="btn btn-primary" id="boton-guardar-responsable" disabled>Asignar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/instituciones.js"></script>
</body>
</html>
