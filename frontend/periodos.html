<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Períodos académicos | TIPI 3.0</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <a class="visually-hidden-focusable position-absolute p-2 bg-white" href="#contenido">Saltar al contenido</a>
  <header id="barra-superior"></header>
  <div class="container-fluid">
    <div class="row">
      <nav id="menu-lateral" class="col-lg-3 col-xl-2 p-0" aria-label="Menú principal"></nav>
      <main id="contenido" class="col-lg-9 col-xl-10 p-3 p-md-4" tabindex="-1">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
          <h1 class="h3 mb-0">Períodos académicos</h1>
          <button type="button" class="btn btn-primary" id="boton-nuevo" hidden>
            <i class="bi bi-plus-lg me-1" aria-hidden="true"></i>Nuevo período
          </button>
        </div>
        <p class="text-body-secondary">Solo un período puede estar activo a la vez.</p>

        <div id="alertas" aria-live="polite"></div>

        <div class="card shadow-sm">
          <div class="table-responsive">
            <table class="table align-middle mb-0">
              <caption class="visually-hidden">Listado de períodos académicos</caption>
              <thead class="table-light">
                <tr>
                  <th scope="col">Período</th>
                  <th scope="col">Inicio</th>
                  <th scope="col">Fin</th>
                  <th scope="col">Estado</th>
                  <th scope="col" class="text-end" id="encabezado-acciones" hidden>Acciones</th>
                </tr>
              </thead>
              <tbody id="cuerpo-tabla"></tbody>
            </table>
          </div>
          <div class="card-footer">
            <small class="text-body-secondary" id="resumen-resultados" aria-live="polite"></small>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="modal fade" id="modal-periodo" tabindex="-1" aria-labelledby="titulo-modal-periodo" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content" id="formulario-periodo" novalidate>
        <div class="modal-header">
          <h2 class="modal-title h5" id="titulo-modal-periodo">Período académico</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div id="alertas-modal" aria-live="polite"></div>
          <div class="row g-3">
            <div class="col-12">
              <label for="campo-nombre" class="form-label">Nombre del período *</label>
              <input type="text" class="form-control" id="campo-nombre" maxlength="50"
                     placeholder="2026-2027" required>
            </div>
            <div class="col-md-6">
              <label for="campo-fechaInicio" class="form-label">Fecha de inicio *</label>
              <input type="date" class="form-control" id="campo-fechaInicio" required>
            </div>
            <div class="col-md-6">
              <label for="campo-fechaFin" class="form-label">Fecha de fin *</label>
              <input type="date" class="form-control" id="campo-fechaFin" required>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="boton-guardar">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/periodos.js"></script>
</body>
</html>
